<!doctype html>
<!--
  PROTOTYPE — THROWAWAY CODE. NOT PRODUCTION.

  VERDICT (settled): none of the four orientation-neutral systems was liked.
  E, the plain one-way Staunton control, won outright and is what we are
  building. See docs/adr/0004-plain-staunton-pieces.md on main. E's glyphs are
  original work and ship as the placeholder set until artists deliver.

  Question it answers: does an orientation-neutral chess piece glyph still read
  instantly as its piece? (ADR 0003 committed us to pieces that read correctly
  from both sides of a table, which rules out every off-the-shelf Staunton set.)

  Five answers, switchable via ?variant=A|B|C|D|E — including E, a plain
  one-way Staunton control, so the premise of ADR 0003 can be tested rather
  than assumed. Hit the rotate button on E to see what the opponent sees.

  ASSUMPTION STATED UP FRONT: the app itself does not exist yet (no Expo project,
  no task runner), so this is a single double-clickable HTML file rather than a
  throwaway route. That is sound here because the thing under evaluation is SVG
  artwork, which renders identically in a browser and in react-native-svg — the
  winning path data transfers over unchanged.

  The real test is on a phone or tablet, so serve it over your LAN:
      npx serve prototypes
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE — orientation-neutral piece sets</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px 120px;
        font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #e8e6e1;
        color: #2a2a28;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .proto-tag {
        font: 600 11px/1 ui-monospace, monospace;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #a33;
        border: 1px solid #a33;
        padding: 5px 9px;
        border-radius: 3px;
        margin-bottom: 18px;
      }
      h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; text-align: center; }
      .question { margin: 0 0 22px; color: #6b6a65; font-size: 14px; text-align: center; max-width: 420px; }
      .stage { width: 100%; max-width: 420px; }
      .label {
        font: 600 11px/1 ui-monospace, monospace;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #8a8983;
        margin: 26px 0 10px;
      }
      /* the board itself: no coordinates, per ADR 0003 */
      .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        width: 100%;
        aspect-ratio: 1;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 2px 14px rgba(0,0,0,.16);
        transition: transform .45s ease;
      }
      .board.flipped { transform: rotate(180deg); }
      .sq { position: relative; }
      .sq.light { background: #ebe7dd; }
      .sq.dark  { background: #b3ad9e; }
      .sq svg { position: absolute; inset: 7%; width: 86%; height: 86%; }
      .legend {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        background: #ebe7dd;
        padding: 10px 6px 6px;
        border-radius: 3px;
      }
      .legend div { text-align: center; }
      .legend svg { width: 100%; height: auto; aspect-ratio: 1; }
      .legend span {
        display: block;
        font: 500 9px/1 ui-monospace, monospace;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: #8a8983;
        margin-top: 3px;
      }
      .legend .row-dark { background: #b3ad9e; border-radius: 2px; }
      .controls { display: flex; gap: 8px; margin-top: 14px; }
      .controls button {
        flex: 1;
        font: 500 13px/1 inherit;
        padding: 11px;
        border: 1px solid #c3bfb4;
        background: #f4f2ee;
        border-radius: 4px;
        cursor: pointer;
        color: #2a2a28;
      }
      .controls button[aria-pressed="true"] { background: #2a2a28; color: #f4f2ee; border-color: #2a2a28; }
      .rationale {
        margin-top: 16px; padding: 13px 15px;
        background: #f4f2ee; border-left: 3px solid #c3bfb4;
        border-radius: 0 3px 3px 0;
        font-size: 13.5px; color: #55544f;
      }
      .rationale b { color: #2a2a28; }
      /* deliberately not part of the design under evaluation */
      .switcher {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 4px;
        background: #16161a; color: #fff;
        border-radius: 999px; padding: 5px 6px;
        box-shadow: 0 5px 22px rgba(0,0,0,.34);
        z-index: 50;
      }
      .switcher button {
        width: 34px; height: 34px; border: 0; border-radius: 999px;
        background: transparent; color: #fff; font-size: 17px; cursor: pointer;
      }
      .switcher button:hover { background: #333; }
      .switcher .name {
        font: 500 13px/1 ui-sans-serif, system-ui;
        padding: 0 12px; min-width: 210px; text-align: center;
      }
      .switcher .name b { font-family: ui-monospace, monospace; margin-right: 7px; }
    </style>
  </head>
  <body>
    <div class="proto-tag">Prototype · throwaway</div>
    <h1>Orientation-neutral piece sets</h1>
    <p class="question">
      The board never flips, so both players see the same pieces at once. Does each
      glyph still read instantly as its piece &mdash; from either side?
    </p>

    <div class="stage">
      <div class="label" id="legend-label">Glyphs</div>
      <div class="legend" id="legend-white"></div>
      <div class="legend row-dark" id="legend-black" style="margin-top:4px"></div>

      <div class="label">At playing size</div>
      <div class="board" id="board"></div>

      <div class="controls">
        <button id="flip" aria-pressed="false">Rotate 180° — view from Black</button>
      </div>

      <div class="rationale" id="rationale"></div>
    </div>

    <div class="switcher">
      <button id="prev" aria-label="Previous variant">&larr;</button>
      <div class="name" id="vname"></div>
      <button id="next" aria-label="Next variant">&rarr;</button>
    </div>

    <script>
      const DARK = '#2a2a28';
      const LIGHT = '#f6f4ef';
      const TYPES = ['k', 'q', 'r', 'b', 'n', 'p'];
      const NAMES = { k: 'King', q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight', p: 'Pawn' };

      // Italian Game — every piece type present in both colours, realistic density.
      const POSITION = [
        ['r', '', 'b', 'q', 'k', 'b', 'n', 'r'],
        ['p', 'p', 'p', 'p', '', 'p', 'p', 'p'],
        ['', '', 'n', '', '', '', '', ''],
        ['', '', '', '', 'p', '', '', ''],
        ['', '', 'B', '', 'P', '', '', ''],
        ['', '', '', '', '', 'N', '', ''],
        ['P', 'P', 'P', 'P', '', 'P', 'P', 'P'],
        ['R', 'N', 'B', 'Q', 'K', '', '', 'R'],
      ];

      const svg = (inner) =>
        `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

      // Shape filled per colour: white pieces are hollow with a dark edge,
      // black pieces are solid. Works for any silhouette.
      const solid = (d, w) =>
        `<path d="${d}" fill="${w ? LIGHT : DARK}" stroke="${DARK}" stroke-width="3.5"
           stroke-linejoin="round" stroke-linecap="round"/>`;
      const circle = (cx, cy, r, w) =>
        `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${w ? LIGHT : DARK}"
           stroke="${DARK}" stroke-width="3.5"/>`;
      const dot = (cx, cy, r, w) =>
        `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${w ? DARK : LIGHT}"/>`;
      // Line-art marks: dark casing with a contrasting core, so white reads hollow.
      const stroke2 = (d, w) =>
        `<path d="${d}" fill="none" stroke="${DARK}" stroke-width="15"
           stroke-linecap="round" stroke-linejoin="round"/>
         <path d="${d}" fill="none" stroke="${w ? LIGHT : DARK}" stroke-width="7"
           stroke-linecap="round" stroke-linejoin="round"/>`;

      /* ------------------------------------------------------------------ *
       * VARIANT A — Top-down realism.
       * Literally what you see looking straight down at a real 3D set. The
       * pieces are already orientation-neutral from directly above, because
       * that is how a physical set solves this. Honest about the knight.
       * ------------------------------------------------------------------ */
      const A = {
        name: 'Top-down realism',
        blurb:
          'What you actually see looking straight down at a real set. A rook is a ring, a bishop is a slit disc, a king is a cross. <b>Watch the knight</b> — from above it is genuinely just a blob, and that is the honest weakness of this approach.',
        glyph(t, w) {
          switch (t) {
            case 'p':
              return svg(circle(50, 50, 17, w));
            case 'r': // hollow crenellated top = a ring with four notches
              return svg(
                circle(50, 50, 28, w) +
                  `<circle cx="50" cy="50" r="15" fill="${w ? DARK : LIGHT}"/>` +
                  [0, 90, 180, 270]
                    .map(
                      (a) =>
                        `<rect x="46" y="17" width="8" height="16" fill="${w ? DARK : LIGHT}"
                           transform="rotate(${a} 50 50)"/>`
                    )
                    .join('')
              );
            case 'b': // the mitre's diagonal groove, read from above
              return svg(
                circle(50, 50, 25, w) +
                  `<path d="M33 33 L67 67" stroke="${w ? DARK : LIGHT}"
                     stroke-width="7" stroke-linecap="round"/>`
              );
            case 'n': // an oval blob — deliberately not rescued
              return svg(
                `<ellipse cx="50" cy="50" rx="19" ry="27" fill="${w ? LIGHT : DARK}"
                   stroke="${DARK}" stroke-width="3.5"/>` +
                  dot(50, 31, 4, w) +
                  dot(50, 69, 4, w)
              );
            case 'q': // coronet of points seen from above
              return svg(
                circle(50, 50, 26, w) +
                  Array.from({ length: 8 }, (_, i) => i * 45)
                    .map((a) => {
                      const rad = (a * Math.PI) / 180;
                      return dot(
                        50 + Math.cos(rad) * 18,
                        50 + Math.sin(rad) * 18,
                        4.5,
                        w
                      );
                    })
                    .join('')
              );
            case 'k': // the cross that sits on top of every king
              return svg(
                circle(50, 50, 27, w) +
                  `<path d="M50 33 V67 M33 50 H67" stroke="${w ? DARK : LIGHT}"
                     stroke-width="8" stroke-linecap="round"/>`
              );
          }
        },
      };

      /* ------------------------------------------------------------------ *
       * VARIANT B — Mirrored Staunton, the playing-card solution.
       * Court cards solved this exact problem centuries ago: draw the top
       * half, then repeat it rotated 180°. Perfectly symmetric by
       * construction, while keeping familiar Staunton profiles.
       * ------------------------------------------------------------------ */
      const B = {
        name: 'Mirrored Staunton (card logic)',
        blurb:
          'The solution playing cards found centuries ago: draw the recognisable top half, then repeat it rotated 180°. <b>Symmetric by construction</b>, and keeps the Staunton profiles everyone already knows. Costs you half the vertical space per glyph.',
        halves: {
          p: 'M40 47 L44 32 Q50 28 56 32 L60 47 Z M50 17 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0',
          r: 'M31 10 h9 v6 h6 v-6 h8 v6 h6 v-6 h9 v14 l-6 5 v18 h-26 v-18 l-6 -5 z',
          n: 'M62 47 C63 38 61 31 54 27 C48 24 43 25 38 28 C34 30 30 31 27 30 C29 25 33 20 39 17 C42 15 45 13 46 10 L49 5 L53 10 C58 13 63 20 65 28 C67 35 67 41 66 47 Z',
          b: 'M50 14 C58 22 62 29 62 36 C62 43 57 46 50 47 C43 46 38 43 38 36 C38 29 42 22 50 14 Z',
          q: 'M33 47 L30 22 L38 32 L44 18 L50 30 L56 18 L62 32 L70 22 L67 47 Z',
          k: 'M35 47 L33 30 Q50 24 67 30 L65 47 Z M47 3 h6 v7 h7 v6 h-7 v7 h-6 v-7 h-7 v-6 h7 z',
        },
        glyph(t, w) {
          const d = this.halves[t];
          // the bishop needs its mitre slit, or the mirrored teardrop reads as a lens
          const extra =
            t === 'b'
              ? `<path d="M44 40 L57 25" stroke="${w ? DARK : LIGHT}"
                   stroke-width="5" stroke-linecap="round"/>`
              : '';
          const half = solid(d, w) + extra;
          return svg(
            `<g>${half}</g><g transform="rotate(180 50 50)">${half}</g>`
          );
        },
      };

      /* ------------------------------------------------------------------ *
       * VARIANT C — Movement semantics.
       * Not a picture of the piece: a picture of how it moves. Every mark is
       * inherently 180°-symmetric, and it teaches the game as you play.
       * ------------------------------------------------------------------ */
      const C = {
        name: 'Movement semantics',
        blurb:
          'Not a picture of the piece — a picture of <b>how it moves</b>. Bishop is a diagonal cross, rook is an orthogonal cross, queen is both, knight is the constellation of its eight destinations. Symmetric for free, and it teaches the game while you play. Asks the most of an existing chess player.',
        glyph(t, w) {
          switch (t) {
            case 'p': // a single step
              return svg(stroke2('M50 40 L50 60', w));
            case 'r': // ranks and files
              return svg(stroke2('M50 22 L50 78 M22 50 L78 50', w));
            case 'b': // diagonals
              return svg(stroke2('M28 28 L72 72 M72 28 L28 72', w));
            case 'q': // both
              return svg(
                stroke2(
                  'M50 20 L50 80 M20 50 L80 50 M29 29 L71 71 M71 29 L29 71',
                  w
                )
              );
            case 'k': // one square in any direction
              return svg(
                `<rect x="26" y="26" width="48" height="48" rx="7"
                   fill="none" stroke="${DARK}" stroke-width="15"/>
                 <rect x="26" y="26" width="48" height="48" rx="7"
                   fill="none" stroke="${w ? LIGHT : DARK}" stroke-width="7"/>` +
                  dot(50, 50, 7, w)
              );
            case 'n': {
              // the eight squares a knight can reach
              const offs = [
                [1, 2], [2, 1], [2, -1], [1, -2],
                [-1, -2], [-2, -1], [-2, 1], [-1, 2],
              ];
              return svg(
                offs
                  .map(
                    ([x, y]) =>
                      `<circle cx="${50 + x * 16}" cy="${50 + y * 16}" r="7.5"
                         fill="${w ? LIGHT : DARK}" stroke="${DARK}" stroke-width="3.5"/>`
                  )
                  .join('')
              );
            }
          }
        },
      };

      /* ------------------------------------------------------------------ *
       * VARIANT D — Diagonal mirror.
       * Same mirroring trick as B, but cut along the diagonal instead of
       * horizontally. The diagonal is 1.41x the side, so each half gets ~40%
       * more room, and the halves are stylised down to just the piece's
       * head — the part that actually distinguishes it — so the set reads as
       * emblems rather than as literal little statues.
       * ------------------------------------------------------------------ */
      // Shared by D and E: the horse head that actually reads as a horse.
      const KNIGHT_HEAD =
        'M30 75 C32 62 38 55 46 52 C40 50 32 47 24 44 C21 43 20 40 22 37 C26 30 33 23 42 18 C45 16 47 12 47 8 L53 13 C62 19 70 30 73 44 C76 56 75 67 74 75 Z';

      // Each emblem is drawn upright and centred on (50,50), deliberately squat
      // — wide and short — because the diagonal offers width where it counts.
      const EMBLEMS = {
        p: (w) =>
          circle(50, 44, 14, w) + solid('M36 57 h28 v12 h-28 z', w),
        r: (w) =>
          solid('M22 38 h9 v8 h11 v-8 h16 v8 h11 v-8 h9 v32 h-56 z', w),
        b: (w) =>
          solid(
            'M50 30 C64 42 72 50 72 58 C72 66 62 70 50 70 C38 70 28 66 28 58 C28 50 36 42 50 30 Z',
            w
          ) +
          `<path d="M42 63 L61 43" stroke="${w ? DARK : LIGHT}"
             stroke-width="6" stroke-linecap="round"/>`,
        q: (w) =>
          solid(
            'M26 70 L22 40 L32 51 L38 35 L44 48 L50 33 L56 48 L62 35 L68 51 L78 40 L74 70 Z',
            w
          ) +
          [[22, 38], [38, 33], [50, 31], [62, 33], [78, 38]]
            .map(([x, y]) => circle(x, y, 4.5, w))
            .join(''),
        k: (w) =>
          solid('M28 70 Q26 52 36 46 Q44 42 50 46 Q56 42 64 46 Q74 52 72 70 Z', w) +
          solid('M45 26 h10 v8 h8 v9 h-8 v8 h-10 v-8 h-8 v-9 h8 z', w),
        n: (w) =>
          // the same horse head used in E, which reads well, squashed wide and
          // short to suit the diagonal
          `<g transform="translate(50 50) scale(0.92 0.66) translate(-48 -41.5)">${solid(
            KNIGHT_HEAD,
            w
          )}<circle cx="41" cy="33" r="3.5" fill="${w ? DARK : LIGHT}"/></g>`,
      };

      const D = {
        name: 'Diagonal mirror',
        blurb:
          'B\'s mirroring, cut along the <b>diagonal</b> instead of horizontally — the diagonal is 1.41&times; the side, so each half gets far more room. Stylised down to the piece\'s <b>head</b> only, so the set reads as emblems rather than little statues. Both players see their half tilted 45°, and identically so &mdash; nobody gets the upside-down seat.',
        glyph(t, w) {
          const e = EMBLEMS[t](w);
          // The knight's two halves fuse into a single wave when they meet
          // nose-to-nose, so it alone is pulled further apart and scaled down
          // to open a clear gap between the muzzles.
          const [s, off] = t === 'n' ? [0.78, 34] : [0.9, 30];
          const place = `translate(${50 * (1 - s)} ${50 * (1 - s) + off}) scale(${s})`;
          return svg(
            `<g transform="rotate(45 50 50) ${place}">${e}</g>
             <g transform="rotate(225 50 50) ${place}">${e}</g>`
          );
        },
      };

      /* ------------------------------------------------------------------ *
       * VARIANT E — Plain Staunton, no mirroring. The control.
       * This is the thing we assumed was unacceptable. Included so the claim
       * can be tested rather than argued: hit the rotate toggle and you are
       * looking at exactly what the opponent looks at all game.
       * ------------------------------------------------------------------ */
      const E = {
        name: 'Plain Staunton (the control)',
        blurb:
          'Ordinary one-way pieces, <b>no mirroring at all</b> — what we assumed was unacceptable. <b>Hit the rotate button</b>: that is precisely what your opponent stares at for the whole game. Judge whether it is actually intolerable, or merely imperfect. Note the knight especially, the one piece that faces a direction.',
        glyph(t, w) {
          const base = (x, y, wd) =>
            solid(`M${x} ${y} h${wd} v9 h-${wd} z`, w);
          switch (t) {
            case 'p':
              return svg(
                circle(50, 26, 11, w) +
                  solid('M41 37 Q39 50 33 60 L31 69 h38 l-2 -9 Q61 50 59 37 Z', w) +
                  base(27, 69, 46)
              );
            case 'r':
              return svg(
                solid(
                  'M28 22 h9 v8 h9 v-8 h8 v8 h9 v-8 h9 v14 l-6 6 v18 l6 8 v3 h-44 v-3 l6 -8 v-18 l-6 -6 z',
                  w
                ) + base(25, 71, 50)
              );
            case 'b':
              return svg(
                circle(50, 14, 5, w) +
                  solid(
                    'M50 20 C60 30 64 40 64 48 C64 56 58 61 50 61 C42 61 36 56 36 48 C36 40 40 30 50 20 Z',
                    w
                  ) +
                  `<path d="M45 45 L57 32" stroke="${w ? DARK : LIGHT}"
                     stroke-width="5" stroke-linecap="round"/>` +
                  solid('M40 62 Q36 70 30 75 h40 Q64 70 60 62 Z', w) +
                  base(25, 75, 50)
              );
            case 'n':
              return svg(
                solid(KNIGHT_HEAD, w) +
                  `<circle cx="41" cy="33" r="3" fill="${w ? DARK : LIGHT}"/>` +
                  base(24, 75, 52)
              );
            case 'q':
              return svg(
                solid(
                  'M31 60 L27 28 L36 40 L40 22 L46 38 L50 20 L54 38 L60 22 L64 40 L73 28 L69 60 Z',
                  w
                ) +
                  [[27, 26], [40, 20], [50, 18], [60, 20], [73, 26]]
                    .map(([x, y]) => circle(x, y, 4, w))
                    .join('') +
                  solid('M33 61 Q29 70 24 75 h52 Q71 70 67 61 Z', w) +
                  base(23, 75, 54)
              );
            case 'k':
              return svg(
                solid('M46 5 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 v-8 h8 z', w) +
                  solid('M31 60 Q29 42 36 33 Q43 27 50 32 Q57 27 64 33 Q71 42 69 60 Z', w) +
                  solid('M33 61 Q29 70 24 75 h52 Q71 70 67 61 Z', w) +
                  base(23, 75, 54)
              );
          }
        },
      };

      const VARIANTS = { A, B, C, D, E };
      const KEYS = Object.keys(VARIANTS);

      const currentKey = () => {
        const k = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
        return KEYS.includes(k) ? k : 'A';
      };

      function render() {
        const key = currentKey();
        const v = VARIANTS[key];

        const cells = (colourIsWhite) =>
          TYPES.map(
            (t) =>
              `<div>${v.glyph(t, colourIsWhite)}<span>${NAMES[t]}</span></div>`
          ).join('');
        document.getElementById('legend-white').innerHTML = cells(true);
        document.getElementById('legend-black').innerHTML = cells(false);

        document.getElementById('board').innerHTML = POSITION.map((row, r) =>
          row
            .map((p, f) => {
              const shade = (r + f) % 2 === 0 ? 'light' : 'dark';
              const piece = p
                ? v.glyph(p.toLowerCase(), p === p.toUpperCase())
                : '';
              return `<div class="sq ${shade}">${piece}</div>`;
            })
            .join('')
        ).join('');

        document.getElementById('rationale').innerHTML = v.blurb;
        document.getElementById('vname').innerHTML = `<b>${key}</b>${v.name}`;
        document.getElementById('legend-label').textContent =
          `Glyphs — ${v.name}`;
      }

      function go(delta) {
        const i = KEYS.indexOf(currentKey());
        const next = KEYS[(i + delta + KEYS.length) % KEYS.length];
        const url = new URL(location.href);
        url.searchParams.set('variant', next);
        history.replaceState({}, '', url);
        render();
      }

      document.getElementById('prev').onclick = () => go(-1);
      document.getElementById('next').onclick = () => go(1);

      const flip = document.getElementById('flip');
      flip.onclick = () => {
        const board = document.getElementById('board');
        const on = board.classList.toggle('flipped');
        flip.setAttribute('aria-pressed', String(on));
        flip.textContent = on
          ? "Rotate back — view from White"
          : 'Rotate 180° — view from Black';
      };

      addEventListener('keydown', (e) => {
        const el = document.activeElement;
        if (el && /^(INPUT|TEXTAREA)$/.test(el.tagName)) return;
        if (el && el.isContentEditable) return;
        if (e.key === 'ArrowLeft') go(-1);
        if (e.key === 'ArrowRight') go(1);
      });

      render();
    </script>
  </body>
</html>
